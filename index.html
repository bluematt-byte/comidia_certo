<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>ComidIA</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">
<h1>Comid<span>IA</span></h1>
<p>Descubra receitas com os ingredientes que você tem</p>
</section>

<section class="app">

<label>Quais ingredientes você tem?</label>
<textarea id="ingredientes" placeholder="Ex: arroz, tomate, frango"></textarea>

<label>Tipo de receita</label>

<select id="tipo">
<option value="rápida">Rápida</option>
<option value="econômica">Econômica</option>
<option value="vegetariana">Vegetariana</option>
<option value="fitness">Fitness</option>
</select>

<button onclick="gerarReceita()">Gerar Receita</button>

<div id="loading" class="card hidden">
<h3>🤖 ComidIA está preparando sua receita...</h3>
<p>Seu pedido está sendo enviado para a IA.</p>
<p><b>O prompt foi copiado automaticamente.</b></p>
<p>Quando o chat abrir, basta colar com <b>CTRL + V</b>.</p>
<p>Aguarde alguns segundos...</p>
</div>

</section>

<script>

function gerarReceita(){

let ingredientes = document.getElementById("ingredientes").value
let tipo = document.getElementById("tipo").value

let prompt = `Crie uma receita usando os seguintes ingredientes: ${ingredientes}.
Tipo de receita: ${tipo}.

Formato da resposta:
Nome da receita
Ingredientes
Modo de preparo
Tempo de preparo.`
  
document.getElementById("loading").classList.remove("hidden")

navigator.clipboard.writeText(prompt)

setTimeout(function(){

window.open("https://poe.com/ComidiaBot", "_blank")

document.getElementById("loading").classList.add("hidden")

},10000)

}

</script>

</body>
</html>
